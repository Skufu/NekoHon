<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ask this book</title>
  <style>
    body { font-family: Georgia, serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; gap: 0.5rem; }
    input { flex: 1; font: inherit; }
    pre { white-space: pre-wrap; }
    figure { margin: 1rem 0; }
    img { max-width: 100%; }
    #refs { color: #666; font-size: 0.9em; }
  </style>
</head>
<body>
  <form id="ask">
    <select name="mode">
      <option value="ask">ask</option>
      <option value="explain">explain</option>
      <option value="quiz">quiz</option>
    </select>
    <input name="question" placeholder="Ask the book">
    <input name="selection" placeholder="Highlighted text">
    <button type="submit">Go</button>
  </form>
  <pre id="answer"></pre>
  <div id="refs"></div>
  <button id="show-key" hidden type="button">Show the key</button>
  <pre id="key" hidden></pre>
  <div id="figures"></div>
  <script>
    const form = document.getElementById("ask");
    const answer = document.getElementById("answer");
    const figures = document.getElementById("figures");
    const showKey = document.getElementById("show-key");
    const key = document.getElementById("key");
    const refs = document.getElementById("refs");
    showKey.addEventListener("click", () => {
      key.hidden = false;
      showKey.hidden = true;
    });
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      answer.textContent = "Looking...";
      figures.replaceChildren();
      refs.textContent = "";
      key.hidden = true;
      showKey.hidden = true;
      const mode = form.mode.value;
      const response = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          book_id: "fde",
          question: mode === "quiz" ? "" : form.question.value,
          selection: form.selection.value || null,
          mode
        })
      });
      const body = await response.json();
      answer.textContent = body.answer || body.error || "";
      refs.textContent = (body.citations || []).map((item) => item.chunk_id).join(" ");
      if (body.refused && refs.textContent) refs.textContent = "nearest misses: " + refs.textContent;
      if (mode === "quiz" && body.citations && body.citations.length) {
        key.textContent = body.citations.map((item) => item.quote).join("\n");
        showKey.hidden = false;
      }
      for (const figure of body.figures || []) {
        const node = document.createElement("figure");
        const image = document.createElement("img");
        image.src = figure.src;
        image.alt = figure.caption || "";
        const caption = document.createElement("figcaption");
        caption.textContent = figure.caption || "";
        node.append(image, caption);
        figures.append(node);
      }
    });
  </script>
</body>
</html>
