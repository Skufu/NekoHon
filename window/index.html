<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ask this book</title>
  <style>
    body { font-family: Georgia, serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; gap: 0.5rem; }
    input { flex: 1; font: inherit; }
    pre { white-space: pre-wrap; }
    figure { margin: 1rem 0; }
    img { max-width: 100%; }
    .nearby { color: #8a6d00; font-style: italic; margin: 1rem 0 0; }
    #refs { color: #666; font-size: 0.9em; }
  </style>
</head>
<body>
  <form id="ask">
    <label>Mode
      <select name="mode">
        <option value="answer" selected>answer</option>
        <option value="ask">ask</option>
        <option value="explain">explain</option>
        <option value="quiz">quiz</option>
      </select>
    </label>
    <label>Question
      <input name="question" placeholder="Ask the book">
    </label>
    <label>Selection
      <input name="selection" placeholder="Highlighted text">
    </label>
    <button type="submit">Go</button>
  </form>
  <pre id="answer"></pre>
  <div id="refs"></div>
  <button id="show-key" hidden type="button">Show the key</button>
  <pre id="key" hidden></pre>
  <div id="figures"></div>
  <script>
    const form = document.getElementById("ask");
    const answer = document.getElementById("answer");
    const figures = document.getElementById("figures");
    const showKey = document.getElementById("show-key");
    const key = document.getElementById("key");
    const refs = document.getElementById("refs");
    showKey.addEventListener("click", () => {
      key.hidden = false;
      showKey.hidden = true;
    });
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      answer.textContent = "Looking...";
      figures.replaceChildren();
      refs.textContent = "";
      key.hidden = true;
      showKey.hidden = true;
      const mode = form.mode.value;
      let response;
      try {
        response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question: mode === "quiz" ? "" : form.question.value,
            selection: form.selection.value || null,
            mode
          })
        });
      } catch (err) {
        answer.textContent = "Could not reach the engine.";
        return;
      }
      let body;
      try {
        body = await response.json();
      } catch (err) {
        answer.textContent = "The engine returned a body that was not JSON.";
        return;
      }
      if (!response.ok && !body.answer && !body.error) {
        answer.textContent = "The engine returned " + response.status + ".";
        return;
      }
      if (body.error && !body.answer) {
        answer.textContent = "Engine problem. " + body.error;
      } else {
        answer.textContent = body.answer || "The engine returned an empty body.";
      }
      if (body.refused) {
        const note = document.createElement("p");
        note.className = "nearby";
        note.textContent = "The check kept no quote. Closest pages are nearby, not the answer.";
        refs.before(note);
      }
      refs.textContent = (body.citations || []).map((item) => {
        const quote = item.quote ? " — " + item.quote.slice(0, 140) : "";
        return "Ch. " + (item.chapter || "?") + " (" + item.chunk_id + ")" + quote;
      }).join("\n");
      if (body.refused && refs.textContent) refs.textContent = "Closest I found.\n" + refs.textContent;
      if (mode === "quiz" && body.citations && body.citations.length) {
        key.textContent = body.citations.map((item) => item.quote).join("\n");
        showKey.hidden = false;
      }
      if (body.refused && (body.figures || []).length) {
        const note = document.createElement("p");
        note.className = "nearby";
        note.textContent = "nearby, not an answer";
        figures.append(note);
      }
      for (const figure of body.figures || []) {
        const node = document.createElement("figure");
        const image = document.createElement("img");
        image.src = figure.src;
        image.alt = figure.caption || "";
        const caption = document.createElement("figcaption");
        caption.textContent = figure.caption || "";
        node.append(image, caption);
        figures.append(node);
      }
    });
  </script>
</body>
</html>
