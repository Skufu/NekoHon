<svg id="chart" viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Statechart: a question is read, searched, guarded, generated, checked for a citation, glossed, and answered or refused"><style>
  .edge{fill:none;stroke:#6f6d66;stroke-width:1.4}
  .edge.refuse{stroke:#8a3b33}
  .edge.answer{stroke:#2f6f6a}
  .elabel{font-family:ui-sans-serif,-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;font-size:11px;fill:#878580;paint-order:stroke;stroke:#100f0f;stroke-width:4;stroke-linejoin:round}
  .node rect{fill:#1c1b1a;stroke:#403e3c}
  .node text{font-family:ui-sans-serif,-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;font-size:13px;fill:#cecdc3}
  .node .small{font-size:11px;fill:#878580}
</style>
<rect width="100%" height="100%" fill="#100f0f"/>

        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#6f6d66"></path>
          </marker>
          <marker id="arrow-ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#8a3b33"></path>
          </marker>
          <marker id="arrow-ans" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#2f6f6a"></path>
          </marker>
        </defs>

        <g class="edges">
          <path id="e-inject" class="edge refuse" d="M435 56 H690 V338" marker-end="url(#arrow-ref)"></path>
          <path id="e-asks" class="edge" d="M330 78 V114" marker-end="url(#arrow)"></path>
          <path id="e-reads" class="edge" d="M330 158 V194" marker-end="url(#arrow)"></path>
          <path id="e-fuses" class="edge" d="M330 238 V274" marker-end="url(#arrow)"></path>
          <path id="e-checks" class="edge" d="M330 318 V354" marker-end="url(#arrow)"></path>
          <path id="e-generate" class="edge" d="M330 398 V434" marker-end="url(#arrow)"></path>
          <path id="e-writes" class="edge" d="M330 478 V514" marker-end="url(#arrow)"></path>
          <path id="e-accept" class="edge answer" d="M330 558 V594" marker-end="url(#arrow-ans)"></path>
          <path id="e-glosses" class="edge answer" d="M330 638 V674" marker-end="url(#arrow-ans)"></path>
          <path id="e-nopass" class="edge refuse" d="M435 216 H735 V338" marker-end="url(#arrow-ref)"></path>
          <path id="e-guardref" class="edge refuse" d="M435 376 H675" marker-end="url(#arrow-ref)"></path>
          <path id="e-gateref" class="edge refuse" d="M435 536 H650 V414 H700" marker-end="url(#arrow-ref)"></path>
          <path id="e-retry" class="edge" d="M225 536 H160 V456 H225" marker-end="url(#arrow)"></path>
        </g>

        <g class="labels">
          <text class="elabel" x="555" y="38" text-anchor="middle"><tspan x="555" y="38">the question tries to</tspan><tspan x="555" y="52">inject instructions</tspan></text>
          <text class="elabel" x="342" y="101">the reader asks</text>
          <text class="elabel" x="342" y="181">the ask is read and searched</text>
          <text class="elabel" x="342" y="261">the passages are fused into a window</text>
          <text class="elabel" x="342" y="341">the question's words are in the book</text>
          <text class="elabel" x="342" y="421">the passages go to the model</text>
          <text class="elabel" x="342" y="501">the model writes a body</text>
          <text class="elabel" x="342" y="574">the citation checks out,</text>
          <text class="elabel" x="342" y="588">or a sentence is recovered</text>
          <text class="elabel" x="342" y="661">the gloss is written</text>
          <text class="elabel" x="560" y="204">no passage matches</text>
          <text class="elabel" x="560" y="356" text-anchor="middle"><tspan x="560" y="356">the book never</tspan><tspan x="560" y="370">mentions it</tspan></text>
          <text class="elabel" x="480" y="512"><tspan x="480" y="512">nothing shown</tspan><tspan x="480" y="526">can back the body</tspan></text>
          <text class="elabel" x="152" y="494" text-anchor="end">uncited,</text>
          <text class="elabel" x="152" y="508" text-anchor="end">one retry</text>
        </g>

        <g class="nodes">
          <g class="node" id="n-q" transform="translate(330 56)">
            <rect x="-105" y="-22" width="210" height="44" rx="9"></rect>
            <text y="5" text-anchor="middle">Question arrives</text>
          </g>
          <g class="node" id="n-read" transform="translate(330 136)">
            <rect x="-105" y="-22" width="210" height="44" rx="9"></rect>
            <text y="5" text-anchor="middle">The question is read</text>
          </g>
          <g class="node" id="n-search" transform="translate(330 216)">
            <rect x="-105" y="-22" width="210" height="44" rx="9"></rect>
            <text y="5" text-anchor="middle">The book is searched</text>
          </g>
          <g class="node" id="n-window" transform="translate(330 296)">
            <rect x="-105" y="-22" width="210" height="44" rx="9"></rect>
            <text y="5" text-anchor="middle">Passages chosen</text>
          </g>
          <g class="node" id="n-guard" transform="translate(330 376)">
            <rect x="-105" y="-22" width="210" height="44" rx="9"></rect>
            <text y="5" text-anchor="middle">Book guard</text>
          </g>
          <g class="node" id="n-gen" transform="translate(330 456)">
            <rect x="-105" y="-22" width="210" height="44" rx="9"></rect>
            <text y="5" text-anchor="middle">The model writes</text>
          </g>
          <g class="node" id="n-gate" transform="translate(330 536)">
            <rect x="-105" y="-22" width="210" height="44" rx="9"></rect>
            <text y="5" text-anchor="middle">Citation gate</text>
          </g>
          <g class="node" id="n-gloss" transform="translate(330 616)">
            <rect x="-105" y="-22" width="210" height="44" rx="9"></rect>
            <text y="5" text-anchor="middle">Gloss pass</text>
          </g>
          <g class="node" id="n-ans" transform="translate(330 696)">
            <rect x="-105" y="-22" width="210" height="44" rx="9"></rect>
            <text y="5" text-anchor="middle">Answer shown</text>
          </g>
          <g class="node" id="n-ref" transform="translate(770 376)">
            <rect x="-95" y="-38" width="190" height="76" rx="9"></rect>
            <text y="-6" text-anchor="middle">Refused</text>
            <text class="small" y="14" text-anchor="middle">Not in this book.</text>
          </g>
        </g>

        <circle id="halo" r="12" fill="#d14d41" opacity="0" cx="690" cy="338"></circle>
        <circle id="token" r="5.5" fill="#d14d41" opacity="0" cx="690" cy="338"></circle>
      </svg>